<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found</title>
    <script>
      (function () {
        var m = location.pathname.match(/\/myluna\/davet\/([A-Za-z0-9-]{3,24})\/?$/);
        if (m) {
          var base = location.pathname.slice(0, location.pathname.indexOf('/myluna/davet/'));
          location.replace(base + '/myluna/davet/?code=' + encodeURIComponent(m[1]));
        }
      })();
    </script>
    <link rel="stylesheet" href="/pages/myluna/site.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Page not found</h1>
      <p class="muted">The page you are looking for does not exist.</p>
      <a class="btn btn-primary" href="/pages/">Go to the home page</a>
    </main>
  </body>
</html>
