<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found</title>
    <style>
      :root {
        --bg: #f7f7f8;
        --ink: #1b1b1f;
        --muted: #62626b;
        --line: #e3e3e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131316;
          --ink: #f2f2f5;
          --muted: #a3a3ad;
          --line: #2e2e36;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 64px 16px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        padding: 12px 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist.</p>
      <a href="/pages/">All apps</a>
    </main>
  </body>
</html>
