<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apps</title>
    <style>
      :root {
        --bg: #f7f7f8;
        --surface: #ffffff;
        --line: #e3e3e8;
        --ink: #1b1b1f;
        --muted: #62626b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131316;
          --surface: #1d1d22;
          --line: #2e2e36;
          --ink: #f2f2f5;
          --muted: #a3a3ad;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 40px 16px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 20px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }
      a.app {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        color: var(--ink);
        text-decoration: none;
      }
      a.app:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      a.app img {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        flex: 0 0 auto;
      }
      a.app strong {
        display: block;
        font-size: 17px;
      }
      a.app span {
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Apps</h1>
      <ul>
        <li>
          <a class="app" href="myluna-app-home.html">
            <img src="myluna-app-icon.png" alt="" />
            <div>
              <strong>MyLuna</strong>
              <span>Period, cycle, fertility and pregnancy tracker.</span>
            </div>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
